<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click Tracker</title>
    <link rel="stylesheet" href="popup.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo-area">
          <img src="icon2.png" alt="Logo" class="logo-icon" />
          <!-- <h2>Click Tracker</h2> -->
        </div>
        <span class="badge" id="click-count">0 Events</span>
      </header>

      <div class="activity-feed" id="activity-list">
        <!-- Items will be injected here via JS -->
        <div class="empty-state">No events recorded yet.</div>
      </div>

      <footer>
        <button id="clear-btn" class="btn-danger">Clear History</button>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
