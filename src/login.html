<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Click Tracker</title>
    <link rel="stylesheet" href="popup.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .login-container {
        padding: 24px;
        display: flex;
        flex-direction: column;
        height: 100vh; /* Fill popup height */
        box-sizing: border-box;
        justify-content: center;
      }
      .login-header {
        text-align: center;
        margin-bottom: 24px;
      }
      .login-header h2 {
        font-size: 20px;
        color: #1e293b;
        margin: 0 0 8px 0;
        font-weight: 700;
      }
      .login-Logo {
        width: auto;
        height: 48px;
        margin-bottom: 12px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #475569;
        margin-bottom: 6px;
      }
      .form-input {
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 14px;
        color: #334155;
        outline: none;
        box-sizing: border-box;
        transition: border-color 0.2s;
      }
      .form-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
      }
      .btn-primary {
        width: 100%;
        padding: 12px;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 8px;
      }
      .btn-primary:hover {
        background: #2563eb;
      }
      .btn-primary:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }
      .error-msg {
        color: #ef4444;
        font-size: 12px;
        text-align: center;
        margin-top: 12px;
        min-height: 18px;
      }
    </style>
  </head>
  <body style="width: 350px; height: 500px; margin: 0">
    <div class="login-container">
      <div class="login-header">
        <img src="icon2.png" alt="Logo" class="login-Logo" />
        <h2>Welcome</h2>
        <p style="font-size: 13px; color: #64748b; margin: 0">
          Sign in to continue
        </p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="name@company.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit" id="login-btn" class="btn-primary">
          Sign In
        </button>
        <div class="error-msg" id="error-msg"></div>
      </form>
    </div>
    <script src="login.js"></script>
  </body>
</html>
